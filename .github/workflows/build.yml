name: Build et publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            commande: dist:win
          - os: macos-latest
            commande: dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire et empaqueter
        run: npm run ${{ matrix.commande }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de signature pour l'instant : les installeurs déclencheront
          # un avertissement SmartScreen (Windows) et Gatekeeper (macOS).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: installeurs-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.yml
          if-no-files-found: warn
