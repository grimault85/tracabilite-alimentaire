name: Application desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            commande: dist:win
          - os: macos-latest
            commande: dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Construire et empaqueter
        run: npm run ${{ matrix.commande }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de signature : les installeurs déclencheront un
          # avertissement SmartScreen (Windows) et Gatekeeper (macOS).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: installeurs-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.yml
          if-no-files-found: warn
